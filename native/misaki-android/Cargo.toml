[package]
name = "misaki-android"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fancy-regex = "0.14"
jni = { version = "0.21", default-features = false }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"

[[bin]]
name = "misaki-parity"
path = "src/bin/misaki_parity.rs"
